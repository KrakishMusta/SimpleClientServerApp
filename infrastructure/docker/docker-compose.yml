version: "3.8"

services:
    postgres:
        image: postgres:15-alpine
        container_name: simple-app-postgres
        environment:
            POSTGRES_DB: simpleapp
            POSTGRES_USER: admin
            POSTGRES_PASSWORD: admin123
        ports:
            - "5432:5432"
        volumes:
            - postgres_data:/var/lib/postgresql/data
        restart: unless-stopped
        healthcheck:
            test: ["CMD-SHELL", "pg_isready -U admin -d simpleapp"]
            interval: 10s
            timeout: 5s
            retries: 5

    pgadmin:
        image: dpage/pgadmin4:latest
        container_name: simple-app-pgadmin
        environment:
            PGADMIN_DEFAULT_EMAIL: admin@admin.com
            PGADMIN_DEFAULT_PASSWORD: admin123
        ports:
            - "5050:80"
        restart: unless-stopped
        depends_on:
            postgres:
                condition: service_healthy

volumes:
    postgres_data:
        driver: local
